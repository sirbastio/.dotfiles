set -g prefix C-a
bind-key C-a send-prefix

set -g base-index 1             # start indexing at 1 instead of 0
setw -g pane-base-index 1       # same for panes
set -g detach-on-destroy off    # don't exit from tmux when closing a session
set -g history-limit 1000000    # increase history size (from 2,000)
set -g renumber-windows on      # renumber all windows when any window is closed
set -g escape-time 0            # zero-out escape time delay
set -g mode-keys vi

# Terminal Capabilities
# These options tell tmux what capabilities the outer terminal has.
# e.g. if the outer terminal reports `TERM=xterm-256color`, this tells tmux is supports 24-bit color.
set -g default-terminal "tmux-256color"
set -a terminal-features ",xterm-256color:RGB"
set -a terminal-features ",xterm-ghostty:RGB:extkeys:hyperlinks"

# Terminal Options
set -s extended-keys on     # support modified-key events 
set -g set-clipboard on     # use system clipboard
set -g focus-events on      # pass focus changes to applications inside panes
set -g mouse on             # enable mouse support
set -g cursor-style blinking-bar

# Pane Borders
set -g pane-border-indicators off
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#30363d"

# Status Bar
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 100

set -g status-style "bg=#04070d,fg=#c9d1d9"
set -g status-left "#{?client_prefix,#[bg=#d2a8ff],#[bg=#58a6ff]}#[fg=#0d1117,bold] 󰆍 #S #[bg=#04070d,fg=#c9d1d9,nobold] "
set -g window-status-separator ""
set -g window-status-current-style "default"
set -g window-status-format "#[bg=#04070d,fg=#7d8590] #I #W#{?window_bell_flag, #[fg=#f85149]󰂞,#{?window_activity_flag, #[fg=#d29922]●,}} "
set -g window-status-current-format "#[bg=#04070d,fg=#58a6ff,bold] #I #[fg=#c9d1d9]#W#{?window_zoomed_flag, #[fg=#d29922]󰊓,} "
set -g status-right "#{?client_prefix,#[bg=#04070d,fg=#d2a8ff,bold] 󰌌 PREFIX ,}#{?window_zoomed_flag,#[bg=#04070d,fg=#d29922,bold] 󰊓 ZOOM ,}#[bg=#04070d,fg=#c9d1d9,nobold] #{?#{==:#{pane_current_command},ssh},󰒍 #{pane_title},󰉋 #{b:pane_current_path}} "
set -g message-style "bg=#04070d,fg=#d2a8ff,fill=#04070d,nobold"
set -g message-command-style "bg=#04070d,fg=#d2a8ff,fill=#04070d,nobold"

# Over SSH:
#   - Change prefix to C-b (tmux default), so it does not clash with C-a
#   - Move the status bar to the bottom so as local is at the top.
if-shell '[ -n "$SSH_CONNECTION" ]' {
    set -g prefix C-b
    set -g status-position bottom
}

# Binds
# Confirm before closing a pane whose foreground command is not a shell.
bind x if-shell -F '#{m/r:^(zsh|bash|fish|sh|dash|ksh)$,#{pane_current_command}}' 'kill-pane' 'confirm-before -p "Close pane running #{pane_current_command}? (y/n)" kill-pane'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -N "Split window vertically" '"' split-window -v -c "#{pane_current_path}"
bind -N "Split window horizontally" % split-window -h -c "#{pane_current_path}"
# bind -N "Create a new window" c if-shell 'test -d #{q:pane_current_path}' 'new-window -c "#{pane_current_path}"' 'new-window -c "#{HOME}"'

# Ctrl+h/j/k/l: Neovim split -> tmux pane -> macOS window (via Hammerspoon).
# Neovim/fzf get the key first; navigate.sh hands off at the window edge.
# ssh gets it too, so the remote Neovim/tmux can navigate (leave an ssh pane with the prefix instead).
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf|ssh)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "run-shell '~/.config/tmux/navigate.sh left #{pane_id}'"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "run-shell '~/.config/tmux/navigate.sh down #{pane_id}'"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "run-shell '~/.config/tmux/navigate.sh up #{pane_id}'"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "run-shell '~/.config/tmux/navigate.sh right #{pane_id}'"
bind -T copy-mode-vi C-h run-shell "~/.config/tmux/navigate.sh left #{pane_id}"
bind -T copy-mode-vi C-j run-shell "~/.config/tmux/navigate.sh down #{pane_id}"
bind -T copy-mode-vi C-k run-shell "~/.config/tmux/navigate.sh up #{pane_id}"
bind -T copy-mode-vi C-l run-shell "~/.config/tmux/navigate.sh right #{pane_id}"

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-yank"

run "~/.tmux/plugins/tpm/tpm"
